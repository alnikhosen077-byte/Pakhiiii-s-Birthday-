<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Elin 🕊️</title>

<meta name="description"
      content="A little birthday surprise for Elin from Anik 🕊️">

<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        "Segoe UI",
        "Noto Sans Bengali",
        Arial,
        sans-serif;

    background:#070914;
    color:white;
    overflow-x:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}


/* ================================
   BACKGROUND
================================ */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(100,120,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(190,100,255,.10),
            transparent 30%
        );

    pointer-events:none;
    z-index:-2;
}


/* ================================
   INTRO SCREEN
================================ */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #171b45 0%,
            #080a18 65%,
            #03040b 100%
        );

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
}

.intro-box{
    width:min(90%,650px);
    padding:40px 25px;
}

.intro-small{
    color:#aeb5e8;
    letter-spacing:3px;
    text-transform:uppercase;
    font-size:12px;
    margin-bottom:20px;
}

.intro-box h1{
    font-size:clamp(45px,9vw,85px);
    margin-bottom:12px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #aeb7ff,
            #fff
        );

    -webkit-background-clip:text;
    color:transparent;

    animation:titleGlow 3s ease-in-out infinite;
}

.intro-name{
    font-size:clamp(25px,6vw,45px);
    color:#dfe3ff;
    margin-bottom:25px;
}

.intro-text{
    color:#aeb3cf;
    line-height:1.9;
    font-size:16px;
}

.enter-btn{
    margin-top:30px;
    padding:14px 32px;

    border:none;
    border-radius:50px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #6875ff,
            #a45ee8
        );

    box-shadow:
        0 10px 35px rgba(100,110,255,.3);

    transition:.3s;

    font-size:16px;
}

.enter-btn:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:
        0 15px 45px rgba(100,110,255,.45);
}

@keyframes titleGlow{
    0%,100%{
        filter:drop-shadow(0 0 5px rgba(170,180,255,.15));
    }
    50%{
        filter:drop-shadow(0 0 25px rgba(170,180,255,.35));
    }
}


/* ================================
   STARS
================================ */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:.55;
    animation:starTwinkle 2s infinite alternate;
}

@keyframes starTwinkle{
    from{
        opacity:.15;
        transform:scale(.7);
    }
    to{
        opacity:.9;
        transform:scale(1.4);
    }
}


/* ================================
   MAIN
================================ */

main{
    position:relative;
    z-index:1;
}

section{
    padding:90px 20px;
    position:relative;
}

.section-title{
    text-align:center;
    font-size:clamp(30px,6vw,48px);
    margin-bottom:12px;

    color:#e9ebff;

    text-shadow:
        0 0 30px rgba(150,160,255,.18);
}

.section-sub{
    max-width:700px;
    margin:0 auto 45px;
    text-align:center;

    color:#9da3c2;
    line-height:1.8;
}


/* ================================
   HERO
================================ */

.hero{
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            rgba(90,100,210,.16),
            transparent 55%
        );
}

.hero-small{
    color:#aab1df;
    letter-spacing:5px;
    font-size:12px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(55px,13vw,130px);
    line-height:.95;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #b9c0ff,
            #e5c5ff
        );

    -webkit-background-clip:text;
    color:transparent;

    animation:heroGlow 4s ease-in-out infinite;
}

.hero-name{
    font-size:clamp(42px,10vw,85px);
    margin-top:10px;

    color:#e4e7ff;
    font-weight:700;
}

.hero-date{
    margin-top:20px;
    letter-spacing:6px;
    color:#8f97c5;
}

.hero-desc{
    max-width:650px;
    margin:25px auto 0;

    color:#b4b8d3;
    line-height:1.9;
    font-size:17px;
}

@keyframes heroGlow{
    0%,100%{
        filter:drop-shadow(0 0 10px rgba(160,170,255,.15));
    }
    50%{
        filter:drop-shadow(0 0 40px rgba(160,170,255,.35));
    }
}


/* ================================
   SCROLL DOWN
================================ */

.scroll-down{
    position:absolute;
    bottom:30px;

    color:#777ea9;
    font-size:13px;
    letter-spacing:2px;

    animation:scrollFloat 2s infinite;
}

@keyframes scrollFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(8px);
    }
}


/* ================================
   COUNTDOWN
================================ */

.countdown{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:35px;
}

.count-box{
    width:100px;
    padding:18px 10px;

    border-radius:22px;

    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(12px);
}

.count-number{
    font-size:40px;
    font-weight:700;
    color:#e4e7ff;
}

.count-label{
    font-size:11px;
    color:#858cae;
    letter-spacing:2px;
    margin-top:4px;
}


/* ================================
   BALLOONS
================================ */

.balloons{
    max-width:900px;
    margin:50px auto 0;

    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.balloon{
    width:75px;
    height:95px;

    border-radius:50% 50% 48% 48%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.35),
            rgba(100,110,220,.45)
        );

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 15px 35px rgba(0,0,0,.25);

    animation:balloonFloat 3s ease-in-out infinite;
}

.balloon:nth-child(2){
    animation-delay:.5s;
}

.balloon:nth-child(3){
    animation-delay:1s;
}

.balloon:nth-child(4){
    animation-delay:1.5s;
}

@keyframes balloonFloat{
    0%,100%{
        transform:translateY(0) rotate(-2deg);
    }
    50%{
        transform:translateY(-18px) rotate(3deg);
    }
}


/* ================================
   POP MESSAGES
================================ */

.message-grid{
    max-width:900px;
    margin:50px auto 0;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.message{
    padding:25px 18px;

    text-align:center;

    border-radius:22px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);

    color:#b7bcda;

    transition:.3s;
}

.message:hover{
    transform:translateY(-7px);
    background:rgba(255,255,255,.06);
}


/* ================================
   STORY
================================ */

.story-card{
    max-width:1100px;
    margin:35px auto;

    padding:20px;

    display:flex;
    align-items:center;
    gap:30px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.09);

    border-radius:30px;

    backdrop-filter:blur(15px);

    transition:.45s;

    opacity:0;
    transform:translateY(60px);
}

.story-card.show{
    opacity:1;
    transform:translateY(0);
}

.story-card:hover{
    transform:translateY(-7px);
    border-color:rgba(160,170,255,.25);
}

.story-card > div:last-child{
    flex:1;
}

.story-card h3{
    font-size:25px;
    color:#e4e7ff;
    margin-bottom:12px;
}

.story-card p{
    color:#b8bddc;
    line-height:1.9;
    font-size:16px;
}


/* ================================
   STORY SCENES
================================ */

.story-scene{
    width:300px;
    height:210px;

    min-width:300px;

    position:relative;
    overflow:hidden;

    border-radius:22px;
}


/* FIRST CALL */

.scene-one{
    background:
        linear-gradient(
            180deg,
            #8799e8 0%,
            #d8c7ef 55%,
            #77758b 56%,
            #44445b 100%
        );
}

.scene-one .sun{
    position:absolute;

    width:55px;
    height:55px;

    border-radius:50%;

    background:#ffe9a5;

    top:25px;
    right:30px;

    box-shadow:0 0 35px #ffe9a5;
}

.scene-one .building{
    position:absolute;

    bottom:40px;
    left:0;

    width:100%;
    height:55px;

    background:#5d6075;
}

.person{
    position:absolute;
    bottom:40px;

    animation:personFloat 3s ease-in-out infinite;
}

.person-boy{
    left:75px;
}

.person-girl{
    left:180px;
    animation-delay:.5s;
}

.person .head{
    width:32px;
    height:32px;

    border-radius:50%;

    background:#d69b76;

    margin:auto;
}

.person .body{
    width:42px;
    height:65px;

    border-radius:15px 15px 6px 6px;

    background:#304774;
}

.person-girl .body{
    background:#7962a5;
}

.call-bubble{
    position:absolute;

    top:45px;
    left:95px;

    background:white;
    color:#34344a;

    padding:7px 13px;

    border-radius:18px;

    font-size:13px;

    animation:bubblePop 2s infinite;
}


/* WALK */

.scene-two{
    background:
        linear-gradient(
            #151e4a 0%,
            #59608e 62%,
            #393847 63%,
            #292933 100%
        );
}

.scene-two .moon{
    position:absolute;

    top:25px;
    right:35px;

    width:50px;
    height:50px;

    border-radius:50%;

    background:#fff0bd;

    box-shadow:0 0 30px #fff0bd;
}

.scene-two .road{
    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:55px;

    background:#303039;
}

.tree{
    position:absolute;

    bottom:45px;

    width:18px;
    height:90px;

    background:#20242c;
}

.tree:before{
    content:"";

    position:absolute;

    width:65px;
    height:65px;

    border-radius:50%;

    background:#26383c;

    left:-23px;
    top:-40px;
}

.tree-left{
    left:30px;
}

.tree-right{
    right:25px;
}

.walk-person{
    position:absolute;

    bottom:42px;

    animation:walking 3s ease-in-out infinite;
}

.walk-boy{
    left:105px;
}

.walk-girl{
    left:155px;
    animation-delay:.3s;
}


/* EXAM */

.scene-three{
    background:
        linear-gradient(
            #a9d2f2,
            #f1dfc9 60%,
            #705441 61%,
            #4b3b34 100%
        );
}

.scene-three .window{
    position:absolute;

    top:20px;
    left:105px;

    width:90px;
    height:70px;

    background:#8ec6e8;

    border:6px solid #eee;
}

.exam-desk{
    position:absolute;

    bottom:30px;

    width:95px;
    height:38px;

    background:#8a6049;

    border-radius:6px;
}

.exam-desk-one{
    left:35px;
}

.exam-desk-two{
    right:35px;
}

.exam-person{
    position:absolute;
    bottom:65px;
}

.exam-boy{
    left:55px;
}

.exam-girl{
    right:55px;
}

.exam-paper{
    position:absolute;

    left:137px;
    bottom:55px;

    font-size:22px;

    animation:paperFloat 2s infinite;
}


/* NIGHT */

.scene-four{
    background:
        linear-gradient(
            #060a27,
            #17194b 70%,
            #10122f
        );
}

.scene-four .big-moon{
    position:absolute;

    top:20px;
    right:28px;

    width:65px;
    height:65px;

    border-radius:50%;

    background:#fff1c4;

    box-shadow:0 0 45px #fff1c4;
}

.night-star{
    position:absolute;

    color:white;

    animation:sceneTwinkle 1.5s infinite alternate;
}

.star-one{
    left:35px;
    top:30px;
}

.star-two{
    left:90px;
    top:65px;
}

.star-three{
    left:155px;
    top:25px;
}

.night-person{
    position:absolute;
    bottom:18px;
}

.night-boy{
    left:80px;
}

.night-girl{
    left:175px;
}

.chat-bubble{
    position:absolute;

    left:125px;
    bottom:90px;

    font-size:25px;

    animation:chatFloat 2s infinite;
}


/* STORY ANIMATIONS */

@keyframes personFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

@keyframes bubblePop{
    0%,100%{
        transform:scale(.9);
        opacity:.5;
    }

    50%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes walking{
    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(10px);
    }
}

@keyframes paperFloat{
    0%,100%{
        transform:rotate(-4deg);
    }

    50%{
        transform:rotate(4deg) translateY(-5px);
    }
}

@keyframes sceneTwinkle{
    from{
        opacity:.3;
    }

    to{
        opacity:1;
    }
}

@keyframes chatFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}


/* ================================
   GALLERY
================================ */

.gallery{
    max-width:1050px;

    margin:50px auto 0;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:22px;
}

.gallery-item{
    overflow:hidden;

    border-radius:25px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.03);

    aspect-ratio:4/3;

    transition:.45s;
}

.gallery-item img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:.6s;
}

.gallery-item:hover{
    transform:translateY(-8px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}

.gallery-item:hover img{
    transform:scale(1.06);
}


/* ================================
   LETTER
================================ */

.letter-wrap{
    max-width:850px;
    margin:50px auto 0;
}

.letter{
    padding:45px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 25px 80px rgba(0,0,0,.2);
}

.letter-top{
    text-align:center;

    color:#aeb6ed;

    margin-bottom:30px;

    font-size:22px;
}

.letter p{
    color:#c0c4dc;

    line-height:2;

    font-size:16px;

    margin-bottom:20px;
}

.letter-sign{
    text-align:right;

    color:#dce0ff;

    margin-top:30px;

    font-size:18px;
}


/* ================================
   FINAL
================================ */

.final{
    min-height:80vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;
}

.final h2{
    font-size:clamp(38px,8vw,75px);

    color:#e8eaff;

    margin-bottom:15px;
}

.final-name{
    font-size:clamp(30px,6vw,55px);

    color:#bfc7ff;

    margin-bottom:30px;
}

.cake{
    font-size:90px;

    animation:cakeFloat 2.5s ease-in-out infinite;

    margin:20px;
}

@keyframes cakeFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

.celebrate-btn{
    padding:15px 35px;

    border:none;
    border-radius:50px;

    color:white;

    font-size:16px;

    background:
        linear-gradient(
            135deg,
            #6674ff,
            #a45de5
        );

    box-shadow:
        0 15px 40px rgba(100,110,255,.25);

    transition:.3s;
}

.celebrate-btn:hover{
    transform:translateY(-5px) scale(1.03);
}


/* ================================
   FOOTER
================================ */

footer{
    padding:35px 20px;

    text-align:center;

    color:#666d92;

    font-size:13px;

    border-top:
        1px solid rgba(255,255,255,.05);
}


/* ================================
   MUSIC BUTTON
================================ */

.music-btn{
    position:fixed;

    right:20px;
    bottom:20px;

    z-index:5000;

    width:52px;
    height:52px;

    border:none;

    border-radius:50%;

    color:white;

    background:
        rgba(90,100,180,.7);

    backdrop-filter:blur(10px);

    border:
        1px solid rgba(255,255,255,.15);

    font-size:20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.3);

    transition:.3s;
}

.music-btn:hover{
    transform:scale(1.08);
}


/* ================================
   RESPONSIVE
================================ */

@media(max-width:800px){

    .message-grid{
        grid-template-columns:1fr;
    }

    .story-card{
        flex-direction:column;
        align-items:stretch;
        gap:20px;
    }

    .story-scene{
        width:100%;
        min-width:0;
        height:220px;
    }

    .story-card h3{
        font-size:21px;
    }

    .letter{
        padding:28px 22px;
    }
}


@media(max-width:500px){

    .hero-desc{
        font-size:15px;
    }

    .count-number{
        font-size:34px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .count-box{
        width:75px;
        padding:14px 7px;
    }

    .count-number{
        font-size:28px;
    }

    .count-label{
        font-size:9px;
        letter-spacing:1px;
    }

    section{
        padding:70px 15px;
    }

}

</style>

</head>


<body>


<!-- ================================
     INTRO
================================ -->

<div id="intro">

    <div class="intro-box">

        <div class="intro-small">
            A Little Surprise From Anik
        </div>

        <h1>

        </h1>

        <div class="intro-name">

        </div>

        <p class="intro-text">

        </p>

        <button

            onclick="enterSite()">

        </button>

    </div>

</div>


<!-- ================================

    <span class="star" style="left:70%;top:68%;animation-delay:1.1s"></span>
    <span class="star" style="left:84%;top:78%;animation-delay:.1s"></span>

</div>


<!-- ================================
     MUSIC
================================ -->

<audio
    id="bgMusic"
    loop>

    <
